name: snapswipe
description: 短视频式相册清理工具(Android 优先,支持照片与视频,左滑保留 / 右滑删除)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 相册读取(图片 + 视频)、缩略图、元信息
  photo_manager: ^3.0.0
  # 权限申请
  permission_handler: ^11.0.0
  # 视频预览播放(M1 可选,后续启用)
  video_player: ^2.7.0
  # 状态管理(M2 引入,此处预声明)
  flutter_riverpod: ^2.4.0
  # 日期格式化
  intl: ^0.19.0
  # 每日配额 / 连续打卡 / 累计统计的本地持久化
  # M3 的数据都是简单键值(今日计数、streak、累计),用 KV 存储足够;
  # 等 M4 做「已保留归档」需要结构化查询时再引入 drift(SQLite)。
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
